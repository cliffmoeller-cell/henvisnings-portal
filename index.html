<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henvisningsportalen | sp-henvisning.dk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --sp-navy: #002147; --sp-gold: #a68d5d; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-navy { background-color: var(--sp-navy); }
        .text-navy { color: var(--sp-navy); }
        .btn-primary { background-color: var(--sp-navy); color: white; transition: all 0.2s; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e5e7eb; }
    </style>
</head>
<body>

    <nav class="bg-navy text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-navy font-bold text-xs">S&P</div>
                <span class="text-xl font-semibold tracking-tight uppercase tracking-widest text-sm md:text-xl">sp-henvisning.dk</span>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-4 text-sm text-white">
                <span id="admin-indicator" class="hidden bg-red-600 px-2 py-1 rounded text-[10px] font-bold uppercase">Admin</span>
                <strong id="display-name"></strong>
                <button onclick="location.reload()" class="bg-white/10 px-3 py-1 rounded hover:bg-white/20 transition text-xs">Log ud</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto py-8 px-4 max-w-6xl">
        <div id="auth-section" class="max-w-md mx-auto card p-8 mt-10">
            <div id="login-view">
                <h2 class="text-2xl font-bold text-navy mb-6 text-center italic underline">Log ind</h2>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <input type="email" id="login-email" placeholder="E-mail" required class="w-full p-3 border rounded text-sm outline-none">
                    <input type="password" id="login-pass" placeholder="Password" required class="w-full p-3 border rounded text-sm outline-none">
                    <button type="submit" id="login-btn" class="w-full btn-primary py-3 rounded-lg font-bold">Log ind</button>
                </form>
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600 italic underline cursor-pointer" onclick="toggleAuth('register')">Ny bruger? Opret dig her</p>
                </div>
            </div>

            <div id="register-view" class="hidden">
                <h2 class="text-2xl font-bold text-navy mb-6 text-center">Opret Profil</h2>
                <form onsubmit="handleRegister(event)" class="space-y-4">
                    <input type="text" id="reg-name" placeholder="Fornavn og Efternavn" required class="w-full p-2 border rounded text-sm">
                    <input type="email" id="reg-email" placeholder="Din E-mail" required class="w-full p-2 border rounded text-sm">
                    <input type="password" id="reg-pass" placeholder="Vælg Password" required class="w-full p-2 border rounded text-sm">
                    <select id="reg-dept" class="w-full p-2 border rounded bg-white text-sm">
                        <option value="Non-Life">Non-Life</option>
                        <option value="Pensions">Pensions</option>
                        <option value="FOGI">FOGI</option>
                    </select>
                    <button type="submit" id="reg-btn" class="w-full btn-primary py-3 rounded-lg font-bold">Opret Bruger</button>
                </form>
                <p class="mt-4 text-center text-xs underline cursor-pointer" onclick="toggleAuth('login')">Tilbage</p>
            </div>
        </div>

        <div id="dashboard-section" class="hidden space-y-6">
            <div id="user-view" class="space-y-6">
                <div class="grid md:grid-cols-3 gap-6">
                    <div class="card p-6 text-center">
                        <h4 class="text-[10px] font-bold text-gray-400 uppercase mb-4 tracking-widest">Din Statistik</h4>
                        <canvas id="referralChart" height="250"></canvas>
                    </div>
                    <div class="md:col-span-2 card p-8">
                        <h3 class="text-xl font-bold text-navy mb-6 italic underline">Ny Henvisning</h3>
                        <div class="grid md:grid-cols-2 gap-8 text-sm">
                            <div class="space-y-4">
                                <label class="block font-bold text-gray-400 uppercase text-[10px]">Virksomhedsdata</label>
                                <div class="flex"><input type="text" id="cvr-input" maxlength="8" placeholder="Indtast CVR nr..." class="w-full p-2 border rounded-l outline-none border-gray-300"><button onclick="lookupCVR()" class="bg-navy text-white px-4 rounded-r font-bold text-xs uppercase">Søg</button></div>
                                <input type="text" id="comp-name" placeholder="Navn" class="w-full p-2 border rounded bg-gray-50 font-bold" readonly>
                                <input type="text" id="comp-employees" placeholder="Antal Ansatte" class="w-full p-2 border rounded bg-blue-50 text-[10px]" readonly>
                                <div class="pt-2 border-t border-gray-100 space-y-2">
                                    <label class="block font-bold text-gray-400 uppercase text-[10px]">Kontaktperson hos kunden</label>
                                    <input type="text" id="contact-name" placeholder="Navn" class="w-full p-2 border rounded text-[10px]">
                                    <input type="tel" id="contact-phone" placeholder="Telefon" class="w-full p-2 border rounded text-[10px]">
                                    <input type="email" id="contact-email" placeholder="E-mail" class="w-full p-2 border rounded text-[10px]">
                                </div>
                            </div>
                            <div class="space-y-3">
                                <label class="block font-bold text-gray-400 uppercase text-[10px]">Modtager af henvisning</label>
                                <select id="target-dept" onchange="filterAdvisors()" class="w-full p-2 border rounded font-bold border-navy text-navy"><option value="">Vælg Afdeling...</option><option value="Non-Life">Non-Life</option><option value="Pensions">Pensions</option><option value="FOGI">FOGI</option></select>
                                <select id="advisor-select" class="w-full p-2 border rounded text-navy border-gray-300"><option value="">Vælg Rådgiver...</option></select>
                                <textarea id="comment" placeholder="Kort besked eller note..." class="w-full p-2 border rounded h-20 text-[10px]"></textarea>
                                <button onclick="sendReferral()" id="send-btn" class="w-full btn-primary py-3 rounded-lg font-bold shadow-lg uppercase text-xs tracking-widest">Send Henvisning</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card p-6">
                    <h3 class="text-lg font-bold text-navy mb-4 italic underline text-sm">Dine Henvisninger</h3>
                    <table class="w-full text-left text-xs"><tbody id="user-table-body"></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURATION (OPDATERET) ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlrjJp8I3MItotSUCUMagOWU85xTpD1_fxTjhyDh28tOgeVWA6PMYUrdMD5BCLehBx/exec";
        const EMAILJS_PUBLIC_KEY = "GhSoP7srq__KYtOsO";
        const EMAILJS_SERVICE_ID = "service_h3qwo3g"; // DIT NYE SERVICE ID
        const TEMPLATE_ADVISOR = "template_onscdrx"; 
        const TEMPLATE_RECEIPT = "template_2ai8tbb"; 

        (function() { emailjs.init(EMAILJS_PUBLIC_KEY); })();

        let currentUser = null;
        let allUsers = [];
        let myChart = null;

        function toggleAuth(view) {
            document.getElementById('login-view').classList.toggle('hidden', view !== 'login');
            document.getElementById('register-view').classList.toggle('hidden', view !== 'register');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const data = {
                type: 'user',
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                pass: document.getElementById('reg-pass').value,
                dept: document.getElementById('reg-dept').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            alert("Bruger oprettet!");
            location.reload();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const resp = await fetch(SCRIPT_URL + "?type=user");
            const rows = await resp.json();
            const userRow = rows.find(r => r[1] === email && r[2].toString() === pass.toString());
            if(userRow) {
                currentUser = { name: userRow[0], email: userRow[1], dept: userRow[3] };
                loginSuccess();
            } else if (email === "admin@sp.dk" && pass === "admin123") {
                currentUser = { name: "Admin", role: "admin" };
                loginSuccess();
            } else { alert("Login fejlede."); }
        }

        function loginSuccess() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('display-name').innerText = currentUser.name;
            loadData();
        }

        async function loadData() {
            const userResp = await fetch(SCRIPT_URL + "?type=user");
            allUsers = await userResp.json();
            const refResp = await fetch(SCRIPT_URL + "?type=referral");
            const allRefs = await refResp.json();
            renderUserTable(allRefs);
            initChart(allRefs);
        }

        function renderUserTable(refs) {
            const tbody = document.getElementById('user-table-body');
            const myRefs = refs.filter(r => r[7] === currentUser.name || r[8] === currentUser.name);
            tbody.innerHTML = myRefs.reverse().map(ref => `
                <tr class="border-b">
                    <td class="p-3 text-gray-400 text-[10px]">${new Date(ref[0]).toLocaleDateString('da-DK')}</td>
                    <td class="p-3 font-bold text-navy uppercase text-[10px]">${ref[1]}</td>
                    <td class="p-3 italic text-gray-400 text-[10px]">${ref[7] === currentUser.name ? 'Sendt til: ' + ref[8] : 'Modtaget fra: ' + ref[7]}</td>
                    <td class="p-3 text-right font-bold text-gold italic uppercase text-[10px]">${ref[9] || 'Sendt'}</td>
                </tr>
            `).join('');
        }

        function filterAdvisors() {
            const dept = document.getElementById('target-dept').value;
            const select = document.getElementById('advisor-select');
            select.innerHTML = '<option value="">Vælg Rådgiver...</option>';
            allUsers.filter(u => u[3] === dept).forEach(u => {
                let opt = document.createElement('option'); 
                opt.value = u[0]; 
                opt.dataset.email = u[1]; 
                opt.innerHTML = u[0];
                select.appendChild(opt);
            });
        }

        async function sendReferral() {
            const btn = document.getElementById('send-btn');
            const select = document.getElementById('advisor-select');
            const advisorName = select.value;
            const advisorEmail = select.options[select.selectedIndex].dataset.email;
            const company = document.getElementById('comp-name').value;
            
            if(!company || !advisorName) return alert("Udfyld venligst alt.");
            
            btn.innerText = "Behandler...";
            btn.disabled = true;

            const data = {
                type: 'referral',
                company: company,
                cvr: document.getElementById('cvr-input').value,
                employees: document.getElementById('comp-employees').value,
                contactName: document.getElementById('contact-name').value,
                contactPhone: document.getElementById('contact-phone').value,
                contactEmail: document.getElementById('contact-email').value,
                senderName: currentUser.name,
                receiverName: advisorName,
                comment: document.getElementById('comment').value
            };

            try {
                // 1. GEM I GOOGLE SHEET
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });

                // 2. PARAMETRE
                const templateParams = {
                    advisor_name: advisorName,
                    advisor_email: advisorEmail,
                    from_name: currentUser.name,
                    from_email: currentUser.email,
                    from_dept: currentUser.dept || "S&P",
                    company: company,
                    employees: data.employees,
                    contact_name: data.contactName,
                    contact_phone: data.contactPhone,
                    contact_email: data.contactEmail,
                    message: data.comment
                };

                // 3. SEND MAILS MED PAUSE (SMTP venlig)
                await emailjs.send(EMAILJS_SERVICE_ID, TEMPLATE_ADVISOR, templateParams);
                await new Promise(r => setTimeout(r, 1500)); // Lidt længere pause for en sikkerheds skyld
                await emailjs.send(EMAILJS_SERVICE_ID, TEMPLATE_RECEIPT, templateParams);

                alert("Succes! Henvisning sendt og kvittering modtaget.");
                location.reload();

            } catch (error) {
                alert("Fejl: " + (error.text || "Tjek SMTP i EmailJS"));
                console.error("Fejl:", error);
                btn.disabled = false;
                btn.innerText = "Send Henvisning";
            }
        }

        async function lookupCVR() {
            const cvr = document.getElementById('cvr-input').value;
            const resp = await fetch(`https://cvrapi.dk/api?search=${cvr}&country=dk`);
            const d = await resp.json();
            document.getElementById('comp-name').value = d.name;
            document.getElementById('comp-employees').value = (d.employees || "0") + " ansatte";
        }

        function initChart(refs) {
            const ctx = document.getElementById('referralChart').getContext('2d');
            const sent = refs.filter(r => r[7] === currentUser.name).length;
            const received = refs.filter(r => r[8] === currentUser.name).length;
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Sendt', 'Modtaget'], datasets: [{ data: [sent, received], backgroundColor: ['#002147', '#a68d5d'] }] },
                options: { cutout: '80%', plugins: { legend: { position: 'bottom' } } }
            });
        }
    </script>
</body>
</html>
