<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&P Referral Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --sp-navy: #002147; --sp-gold: #a68d5d; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-navy { background-color: var(--sp-navy); }
        .text-navy { color: var(--sp-navy); }
        .btn-primary { background-color: var(--sp-navy); color: white; transition: all 0.2s; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e5e7eb; }
    </style>
</head>
<body>

    <nav class="bg-navy text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-navy font-bold text-xs">S&P</div>
                <span class="text-xl font-semibold tracking-tight">Referral Portal</span>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-4 text-sm">
                <span><i class="fas fa-user-circle mr-1"></i> <strong id="display-name"></strong> (<span id="display-dept"></span>)</span>
                <button onclick="location.reload()" class="bg-white/10 px-3 py-1 rounded hover:bg-white/20 transition">Log ud</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto py-12 px-4 max-w-6xl">
        
        <div id="auth-section" class="max-w-md mx-auto card p-8">
            <div id="login-view">
                <h2 class="text-2xl font-bold text-navy mb-6 text-center">Log ind</h2>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <input type="email" id="login-email" placeholder="E-mail" required class="w-full p-3 border rounded outline-none focus:ring-2 focus:ring-blue-900">
                    <input type="password" id="login-pass" placeholder="Password" required class="w-full p-3 border rounded outline-none focus:ring-2 focus:ring-blue-900">
                    <button type="submit" class="w-full btn-primary py-3 rounded-lg font-bold">Log ind</button>
                </form>
                <p class="mt-6 text-center text-sm text-gray-600">
                    Har du ikke en konto? <a href="#" onclick="toggleAuth(false)" class="text-blue-900 font-bold underline">Opret dig her</a>
                </p>
            </div>

            <div id="register-view" class="hidden text-left">
                <h2 class="text-2xl font-bold text-navy mb-6 text-center">Opret Profil</h2>
                <form onsubmit="handleRegister(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase">Fulde Navn</label>
                        <input type="text" id="reg-name" required class="w-full p-2 border rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase">E-mail</label>
                        <input type="email" id="reg-email" required class="w-full p-2 border rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase">Vælg Password</label>
                        <input type="password" id="reg-pass" required class="w-full p-2 border rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase">Din Afdeling</label>
                        <select id="reg-dept" class="w-full p-2 border rounded mt-1 bg-white">
                            <option value="Non-Life">Non-Life</option>
                            <option value="Pensions">Pensions</option>
                            <option value="FOGI">FOGI</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full btn-primary py-3 rounded-lg font-bold mt-2">Opret Bruger</button>
                </form>
